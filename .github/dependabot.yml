version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /crates/exceljs-rs-node
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /compat
    schedule:
      interval: weekly
    ignore:
      - dependency-name: exceljs
  - package-ecosystem: npm
    directory: /bench
    schedule:
      interval: weekly
    ignore:
      - dependency-name: exceljs
