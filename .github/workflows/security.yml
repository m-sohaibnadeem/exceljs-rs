name: Dependency audit

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['Cargo.lock', '**/package-lock.json', '.github/workflows/security.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: npm audit --prefix crates/exceljs-rs-node
      - run: npm audit --prefix compat
      - run: npm audit --prefix bench
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
