[workspace]
resolver = "2"
members = ["crates/exceljs-rs", "crates/exceljs-rs-node"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/m-sohaibnadeem/exceljs-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
# Drops symbol tables from the addon (3.6 MB -> 2.8 MB); the code is unchanged.
strip = "symbols"
